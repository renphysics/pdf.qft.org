<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f8f7f2; font-family: Inter, sans-serif; color: #22352b; position: relative; overflow: hidden; }
  .brand { position: absolute; left: 88px; top: 72px; display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 650; letter-spacing: -1px; }
  .brand svg { width: 46px; height: 46px; }
  .brand span { font-weight: 450; color: #52735a; }
  h1 { position: absolute; left: 84px; top: 170px; font-family: 'Bitstream Charter', Georgia, serif; font-weight: 400; font-size: 104px; line-height: 1.04; letter-spacing: -3px; }
  h1 em { color: #52735a; }
  p { position: absolute; left: 88px; top: 418px; width: 600px; font-size: 29px; line-height: 1.45; color: #536555; }
  .footer { position: absolute; left: 88px; bottom: 58px; display: flex; gap: 26px; font-size: 22px; color: #536555; align-items: center; }
  .footer b { color: #244e41; font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #52735a; }
  .stack { position: absolute; right: 92px; top: 108px; width: 330px; height: 420px; }
  .sheet { position: absolute; width: 270px; height: 350px; border-radius: 14px; background: #fff; border: 1.5px solid #c4d1c0; box-shadow: 0 24px 60px rgb(39 58 38 / 0.12); padding: 34px 30px; }
  .back { left: 0; top: 40px; transform: rotate(-8deg); background: #e4ece0; }
  .front { right: 0; top: 0; transform: rotate(4deg); }
  .badge { display: inline-block; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; color: #244e41; background: #e4ece0; padding: 6px 10px; border-radius: 6px; margin-bottom: 26px; }
  .line { height: 10px; border-radius: 5px; background: #e4ece0; margin-bottom: 16px; }
  .mark { position: absolute; left: 30px; right: 30px; top: 150px; text-align: center; font-family: 'Bitstream Charter', serif; font-style: italic; font-size: 44px; color: rgb(82 115 90 / 0.28); transform: rotate(-24deg); letter-spacing: 3px; }
  .num { position: absolute; left: 30px; bottom: 22px; font-size: 15px; color: #536555; }
  .plus { position: absolute; right: -6px; bottom: 34px; width: 74px; height: 74px; border-radius: 50%; background: #244e41; color: #fff; font-size: 44px; line-height: 70px; text-align: center; box-shadow: 0 14px 30px rgb(39 58 38 / 0.25); }
</style></head><body>
  <div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#244e41"/><circle cx="30" cy="29" r="16" fill="none" stroke="#faf8f2" stroke-width="6"/><path d="m35 35 15 15" fill="none" stroke="#c2d7ba" stroke-width="6" stroke-linecap="round"/></svg>QFT <span>PDF</span></div>
  <h1>Every PDF.<br><em>A little simpler.</em></h1>
  <p>Edit, merge, split and number PDFs for free, right in your browser.</p>
  <div class="footer"><b>pdf.qft.org</b><i class="dot"></i>No uploads<i class="dot"></i>No sign-up</div>
  <div class="stack">
    <div class="sheet back"></div>
    <div class="sheet front"><span class="badge">PDF</span><div class="line" style="width:86%"></div><div class="line" style="width:64%"></div><div class="line" style="width:78%"></div><div class="line" style="width:52%"></div><div class="mark">DRAFT</div><div class="line" style="width:72%;margin-top:120px"></div><div class="num">Page 1 of 3</div></div>
    <div class="plus">+</div>
  </div>
</body></html>
