name: Vendored libraries

# Once a month: do the libraries bundled under dist/assets/vendor (pdf-lib,
# PDF.js, fontkit) have newer releases on npm? The bundles are updated by hand
# (README: "Updating the libraries"), so this opens one issue, or adds to it,
# when there is something to update.
on:
  schedule:
    - cron: '17 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Compare the bundled versions with npm
        id: compare
        run: node scripts/check-vendored-versions.mjs
      - name: Open the issue, or add to it
        if: steps.compare.outputs.newer != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.compare.outputs.report }}
        run: |
          title='Newer releases of the bundled libraries'
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="$(printf '%s\n\n%s' "$REPORT" 'The bundles under dist/assets/vendor are updated by hand: see "Updating the libraries" in the README. The Vendored libraries workflow checks once a month and keeps this issue up to date.')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
