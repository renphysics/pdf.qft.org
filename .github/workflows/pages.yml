name: Deploy QFT PDF to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      # Restores the verified CJK font into dist/, checks the static site, then
      # runs the PDF engine and workflow suites. A failure blocks deployment.
      - name: Restore font assets and run all tests
        run: npm test
      # The editing journeys in tests/QA-CHECKLIST.md, in Chromium, WebKit
      # (Safari's engine) and Firefox, including a stamped copy of the site under
      # the project path. A failure blocks deployment.
      - name: Install the browsers for Playwright
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Run the browser tests
        run: npm run test:browser
      # GitHub Pages lets browsers cache every file for ten minutes under the
      # same URL, so a reload right after a deploy could mix the new page with
      # the previous release's scripts. Versioned URLs keep each release whole.
      - name: Version asset URLs for this release
        run: |
          node scripts/stamp-release.mjs dist
          node tests/site-integrity.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
