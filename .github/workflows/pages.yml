name: Deploy QFT PDF to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Jobs run on Ubuntu 24.04, not ubuntu-latest: that label moved to 26.04 on
# 2026-11-06, where Playwright's dependency install took 40 minutes. (See
# test.yml for the other thing 26.04 changed, which the tests now allow for.)
jobs:
  # The checks a pull request gets: the static site, the PDF engine suites and
  # the browser tests in Chromium, WebKit and Firefox, one job per engine. A
  # failure blocks deployment.
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Restore font assets
        run: node scripts/prepare-assets.mjs
      # GitHub Pages lets browsers cache every file for ten minutes under the
      # same URL, so a reload right after a deploy could mix the new page with
      # the previous release's scripts. Versioned URLs keep each release whole.
      - name: Version asset URLs for this release
        run: |
          node scripts/stamp-release.mjs dist
          node tests/site-integrity.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
