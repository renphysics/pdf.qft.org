name: Deploy QFT PDF to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Jobs run on Ubuntu 24.04, not ubuntu-latest: that label moved to 26.04 on
# 2026-11-06, whose libsoup 3.6 rewrites spaces in download file names as
# underscores in WebKit (the tests check the names the app chooses), and whose
# Playwright dependency install took 40 minutes.
jobs:
  # The checks a pull request gets: the static site, the PDF engine suites and
  # the browser tests in Chromium, WebKit and Firefox, one job per engine. A
  # failure blocks deployment.
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Restore font assets
        run: node scripts/prepare-assets.mjs
      # GitHub Pages lets browsers cache every file for ten minutes under the
      # same URL, so a reload right after a deploy could mix the new page with
      # the previous release's scripts. Versioned URLs keep each release whole.
      - name: Version asset URLs for this release
        run: |
          node scripts/stamp-release.mjs dist
          node tests/site-integrity.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
