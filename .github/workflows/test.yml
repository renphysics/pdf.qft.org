name: Test

# Pull requests run the same checks that gate the Pages deployment.
on:
  pull_request:
  workflow_dispatch:
  # The Pages workflow runs these jobs before it deploys.
  workflow_call:

permissions:
  contents: read

# One run per branch: a newer push to a pull request cancels the older run.
# When the Pages workflow calls this one, the group is keyed by its name too, and
# a push or a manual run never cancels anything, so a run of Test on main cannot
# cancel the tests a deploy is waiting for.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run on Ubuntu 24.04, not ubuntu-latest: that label moved to 26.04 on
# 2026-11-06, whose libsoup 3.6 rewrites spaces in download file names as
# underscores in WebKit (the tests check the names the app chooses), and whose
# Playwright dependency install took 40 minutes.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Restore font assets and run all tests
        run: npm test

  # The editing journeys in tests/QA-CHECKLIST.md (tests/browser), one job per
  # browser engine: Chromium, WebKit (Safari's engine) and Firefox.
  browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser
            browser: chromium
          - name: browser (WebKit)
            browser: webkit
          - name: browser (Firefox)
            browser: firefox
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the browser tests
        run: npm run test:browser
        env:
          BROWSERS: ${{ matrix.browser }}
      # When a test fails: its screenshots and traces, and the HTML report, to
      # download from the run's summary page.
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/output/
          retention-days: 14
          if-no-files-found: ignore
